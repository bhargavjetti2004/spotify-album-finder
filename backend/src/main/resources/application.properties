# Server Configuration
server.port=8080
spring.application.name=spotify-album-finder

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/spotify_album_finder?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Spotify API Configuration
spotify.client-id=${SPOTIFY_CLIENT_ID:22b9ca55f4a0436fbd86dfd7c2849976}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:215d7fe0df02444ba72aa1f0a0304379}
spotify.token-url=https://accounts.spotify.com/api/token
spotify.api-base-url=https://api.spotify.com/v1
